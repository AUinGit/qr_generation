<!DOCTYPE html>
<!-- index.html -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QRコードグリッド生成ツール（PDFプレビュー対応）</title>
  <!-- QRコード生成ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- jsPDF（PDF生成用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
  <!-- html2canvas（DOM→画像化用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 20px;
    }
    h1 {
      font-size: 1.4rem;
    }
    label {
      font-size: 0.9rem;
      display: block;
      margin-top: 8px;
    }
    input, select, textarea, button {
      font-size: 0.9rem;
      margin-top: 4px;
    }
    textarea {
      width: 100%;
      height: 120px;
    }
    #controls {
      max-width: 640px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    #messages {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #d00;
    }

    /* ここからプレビュー（PDFページの見た目を再現） */
    #previewWrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    #pdfPreviewContainer {
      border: 1px dashed #aaa;
      padding: 8px;
    }

    #pdfPreviewLabel {
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    /* A4縦をおおまかに再現（pxベースだが縦横比はA4と同じ） */
    #pdfPreview {
      position: relative;
      width: 595px;   /* A4幅 @72dpi 相当 */
      height: 842px;  /* A4高さ @72dpi 相当 */
      background: #fff;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* ページ内マージン */
    #pdfPreviewInner {
      position: absolute;
      inset: 40px; /* 四辺 40px の余白（見た目用） */
      display: grid;
      gap: 8px;
      box-sizing: border-box;
    }

    .qrCell {
      border: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      box-sizing: border-box;
      font-size: 0.7rem;
    }

    .qrCanvasWrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qrCell canvas, .qrCell img {
      max-width: 100%;
      max-height: 100%;
    }

    .qrText {
      margin-top: 4px;
      word-break: break-all;
      text-align: center;
    }

    /* 補助：行列プレビュー（数だけ確認したいとき用） */
    #layoutPreview {
      display: grid;
      gap: 4px;
      margin-top: 8px;
    }
    .previewCell {
      background: #e0f0ff;
      border: 1px solid #99b;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      box-sizing: border-box;
    }

    #pdfButton {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>n×m QRコードグリッド生成ツール（PDFプレビュー対応）</h1>

  <div id="controls">
    <label>
      行数 (n):
      <input type="number" id="rows" value="3" min="1">
    </label>
    <label>
      列数 (m):
      <input type="number" id="cols" value="3" min="1">
    </label>

    <label>
      QRコードの大きさ（プレビュー内のセル比率で自動調整します）
      <span style="display:block;font-size:0.8rem;color:#555;">
        ※物理サイズはPDF生成時に自動でページ幅に合わせて縮小されます。
      </span>
    </label>

    <label>
      復元率（エラー訂正レベル）:
      <select id="ecc">
        <option value="L">L (7%)</option>
        <option value="M" selected>M (15%)</option>
        <option value="Q">Q (25%)</option>
        <option value="H">H (30%)</option>
      </select>
    </label>

    <label>
      バージョン（auto または 1〜40）:
      <input type="text" id="version" value="auto" placeholder="auto または数字">
    </label>

    <label>
      各セルに入れるテキスト（1行につき1つのQRコード）:
      <textarea id="texts" placeholder="例：
https://example.com/1
https://example.com/2
..."></textarea>
    </label>

    <button id="generateButton">QRコードを生成＆プレビュー更新</button>
    <button id="pdfButton" disabled>このプレビューと同じ見た目でPDFを出力</button>

    <div id="messages"></div>
  </div>

  <div id="previewWrapper">
    <div id="pdfPreviewContainer">
      <div id="pdfPreviewLabel">PDF プレビュー（この見た目がほぼそのままPDFになります）</div>
      <div id="pdfPreview">
        <div id="pdfPreviewInner">
          <!-- ここにグリッドとしてQRが並ぶ -->
        </div>
      </div>
    </div>

    <div>
      <h2>配置イメージ（行×列）</h2>
      <div id="layoutPreview"></div>
    </div>
  </div>

  <script>
    const generateButton = document.getElementById("generateButton");
    const pdfButton = document.getElementById("pdfButton");
    const messages = document.getElementById("messages");
    const pdfPreviewInner = document.getElementById("pdfPreviewInner");
    const layoutPreview = document.getElementById("layoutPreview");

    let currentConfig = null; // PDF生成時に参照するための情報

    function parseVersion(value) {
      if (!value || value.toLowerCase() === "auto") return 0; // 0 = 自動
      const n = parseInt(value, 10);
      if (isNaN(n) || n < 1 || n > 40) return 0;
      return n;
    }

    function showMessage(msg, isError = true) {
      messages.style.color = isError ? "#d00" : "#060";
      messages.textContent = msg;
    }

    function clearPreview() {
      pdfPreviewInner.innerHTML = "";
      layoutPreview.innerHTML = "";
    }

    function generatePreview() {
      const rows = parseInt(document.getElementById("rows").value, 10);
      const cols = parseInt(document.getElementById("cols").value, 10);
      const ecc = document.getElementById("ecc").value;
      const versionInput = document.getElementById("version").value.trim();
      const version = parseVersion(versionInput);

      if (!rows || !cols || rows < 1 || cols < 1) {
        showMessage("行数・列数は1以上の整数にしてください。");
        return;
      }

      const textsRaw = document.getElementById("texts").value
        .split("\n")
        .map(s => s.trim())
        .filter(s => s.length > 0);

      const required = rows * cols;
      if (textsRaw.length < required) {
        showMessage(`テキストが不足しています。必要: ${required} 個 / 入力: ${textsRaw.length} 行`);
        return;
      }

      showMessage("", false);
      clearPreview();

      // プレビューのグリッド設定
      pdfPreviewInner.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      pdfPreviewInner.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      // 行列プレビュー
      layoutPreview.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 60px))`;

      currentConfig = {
        rows,
        cols,
        ecc,
        version,
        texts: textsRaw.slice(0, required)
      };

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const index = r * cols + c;
          const text = textsRaw[index];

          // ====== PDFプレビュー側のセル ======
          const cell = document.createElement("div");
          cell.className = "qrCell";

          const qrWrapper = document.createElement("div");
          qrWrapper.className = "qrCanvasWrapper";

          const qrContainer = document.createElement("div");
          qrContainer.style.width = "90%";
          qrContainer.style.height = "90%";

          qrWrapper.appendChild(qrContainer);
          cell.appendChild(qrWrapper);

          const textDiv = document.createElement("div");
          textDiv.className = "qrText";
          textDiv.textContent = text;
          cell.appendChild(textDiv);

          pdfPreviewInner.appendChild(cell);

          // QRコード生成（プレビューにもそのまま出る）
          new QRCode(qrContainer, {
            text: text,
            width: 256,   // 高解像度で作っておき、CSSで縮小
            height: 256,
            correctLevel: QRCode.CorrectLevel[ecc]
          });
          // versionはqrcode.js本体が自動選択（0指定）になるため、
          // プレビューとPDFで同じアルゴリズムが走る = 見た目は一致。

          // ====== 行列プレビュー用セル ======
          const previewCell = document.createElement("div");
          previewCell.className = "previewCell";
          previewCell.textContent = `${r + 1},${c + 1}`;
          layoutPreview.appendChild(previewCell);
        }
      }

      pdfButton.disabled = false;
      showMessage("プレビューを更新しました。この見た目に基づいてPDFを出力できます。", false);
    }

    async function generatePDF() {
      if (!currentConfig) {
        showMessage("先にQRコードを生成してプレビューを更新してください。");
        return;
      }

      const previewElement = document.getElementById("pdfPreview");

      showMessage("PDFを生成しています…（少し時間がかかる場合があります）", false);
      pdfButton.disabled = true;
      generateButton.disabled = true;

      try {
        // プレビューDOM全体を画像にする
        const canvas = await html2canvas(previewElement, {
          scale: 2,   // 解像度アップ
          useCORS: true
        });

        const imgData = canvas.toDataURL("image/png");

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4"
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        // プレビューのアスペクト比を維持しつつ、ページ内に最大化
        const imgWidthPx = canvas.width;
        const imgHeightPx = canvas.height;
        const imgAspect = imgWidthPx / imgHeightPx;
        const pageAspect = pageWidth / pageHeight;

        let renderWidth, renderHeight;
        if (imgAspect > pageAspect) {
          // 横長なので幅基準
          renderWidth = pageWidth;
          renderHeight = pageWidth / imgAspect;
        } else {
          // 縦長なので高さ基準
          renderHeight = pageHeight;
          renderWidth = pageHeight * imgAspect;
        }

        const offsetX = (pageWidth - renderWidth) / 2;
        const offsetY = (pageHeight - renderHeight) / 2;

        pdf.addImage(imgData, "PNG", offsetX, offsetY, renderWidth, renderHeight);
        pdf.save("qr_grid_preview.pdf");

        showMessage("PDFを生成しました。プレビューと同じ配置で出力されています。", false);
      } catch (e) {
        console.error(e);
        showMessage("PDF生成中にエラーが発生しました。コンソールを確認してください。");
      } finally {
        pdfButton.disabled = false;
        generateButton.disabled = false;
      }
    }

    generateButton.addEventListener("click", generatePreview);
    pdfButton.addEventListener("click", generatePDF);
  </script>
</body>
</html>
